[project]
name = "multicard-bench"
version = "0.1.0"
description = "Experiments for multi-card retrieval: purpose-specific embedding views, two-pass gating, and consumer-dependent diversity"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    # torch 2.2.2 is the last release shipping macOS x86_64 wheels, and the
    # development machine is an Intel Mac. Linux and Apple Silicon users can
    # relax this pin; results are CPU-deterministic either way.
    "torch==2.2.2",
    # transformers 5.x requires torch>=2.5, so it is pinned to the 4.x line that
    # works with the torch above. This combination is verified on the machine.
    "transformers>=4.55,<5",
    "sentence-transformers>=5.0,<6",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    "datasets>=2.19",
    "google-genai>=1.0",
    "bertopic==0.17.4",
    "llvmlite==0.43.0",
    "numba==0.60.0",
    "spacy>=3.8.16",
    "python-igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "en-core-web-sm",
    "pyarrow>=25.0.1",
    "psycopg[binary]>=3.3.5",
]

[project.scripts]
mcb = "multicard.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multicard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
